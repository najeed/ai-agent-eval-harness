[project]
name = "dataproc-engine"
version = "0.1.0"
description = "High-Signal Industry Dataset Utility"
authors = [
    { name = "Najeed Khan", email = "agentvos@agentvos.ai" }
]
dependencies = [
    "click==8.3.1",
    "pydantic==2.13.4",
    "aiohttp==3.14.3",
    "pandas==3.0.5",
    "pyarrow==23.0.1"
]
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
dataproc-cli = "dataproc_engine.cli.main:cli"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
