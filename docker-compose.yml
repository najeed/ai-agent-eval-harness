version: '3.8'

services:
  agent:
    build:
      context: .
      dockerfile: sample_agent/Dockerfile
    ports:
      - "5001:5001"
    networks:
      - lab-network

  harness:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    environment:
      - AGENT_API_URL=${AGENT_API_URL}
      - EVAL_MAX_TURNS=${EVAL_MAX_TURNS}
    depends_on:
      - agent
    networks:
      - lab-network

  console:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - .:/app
    command: agentv console --port 5000 --host 0.0.0.0
    ports:
      - "5000:5000"
      - "5173:5173"
    depends_on:
      - harness
    networks:
      - lab-network

networks:
  lab-network:
    driver: bridge

