name: Agent Reliability Gate

on:
  pull_request:
    branches: [ main, dev ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  push:
    branches: [ main, dev ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  evaluate-agents:
    if: github.repository == 'najeed/ai-agent-eval-harness'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Install Eval Harness
        run: |
          pip install -e .
          pip install -r requirements.txt

      - name: Validate AES Scenarios
        run: |
          agentv aes validate --path industries/telecom/scenarios/

      - name: Run Industry Evaluation (Telecom)
        run: |
          agentv evaluate --path industries/telecom/scenarios --format jsonl --output reports/eval_results.json
        env:
          OTEL_SDK_DISABLED: true
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || '' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || '' }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY || '' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || '' }}

      - name: Run Global Scenario Evaluation
        run: |
          agentv evaluate --path scenarios/ --attempts 3

      - name: Upload Replay Traces
        uses: actions/upload-artifact@v4
        with:
          name: agent-run-traces
          path: reports/trajectories/*.jsonl

      - name: Regression Check
        run: |
          # [Future] eval-harness compare ./reports ./baselines --threshold 0.05
          echo "Regression check passed (baseline comparison simulated)"
