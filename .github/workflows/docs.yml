name: docs

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'ui/docs-platform/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    if: github.repository == 'najeed/ai-agent-eval-harness'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Checkout Persistence Branch (gh-pages)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: final-site
        continue-on-error: true

      - name: Initialize Persistence Path
        run: mkdir -p final-site

      # --- 1. Legacy Docs Build (MkDocs) ---
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt
      - run: pip install mkdocs-material
      - name: Build Legacy Metrics (MkDocs)
        run: mkdocs build

      # --- 2. Primary Docs Build (Starlight) ---
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Starlight Dependencies
        run: |
          cd docs
          npm ci || npm install

      - name: Build Primary Starlight Docs (Main)
        if: github.ref == 'refs/heads/main'
        env:
          BASE_URL: /ai-agent-eval-harness/
        run: |
          cd docs
          npm run build

      - name: Build Primary Starlight Docs (Dev)
        if: github.ref == 'refs/heads/dev'
        env:
          BASE_URL: /ai-agent-eval-harness/dev/
        run: |
          cd docs
          npm run build

      # --- 3. Assembly Logic (Merge into Persistence Path) ---
      - name: Assemble Site (Main)
        if: github.ref == 'refs/heads/main'
        run: |
          # Starlight to Root
          cp -rv docs/dist/* final-site/
          # MkDocs to /old
          mkdir -p final-site/old
          cp -rv site/* final-site/old/

      - name: Assemble Site (Dev)
        if: github.ref == 'refs/heads/dev'
        run: |
          # Starlight to /dev
          mkdir -p final-site/dev
          cp -rv docs/dist/* final-site/dev/
          # MkDocs to /old-dev
          mkdir -p final-site/old-dev
          cp -rv site/* final-site/old-dev/

      # --- 4. Deployment & Persistence ---
      - name: Sync Persistence Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./final-site
          publish_branch: gh-pages
          keep_files: false
