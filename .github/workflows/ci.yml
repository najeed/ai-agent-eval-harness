name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  STRICT_PLUGINS: true

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.12', '3.14']
    
    permissions:
      contents: read

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        token: ${{ github.token }}
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Lint & Format with Ruff
      run: |
        ruff check .
        ruff format --check .

    - name: Verify Documentation Path Validity
      run: python docs/check_doc_paths.py

    - name: Install Playwright Browsers
      run: python -m playwright install --with-deps chromium

    - name: Detect scenario changes
      uses: dorny/paths-filter@v3
      id: changes
      with:
        filters: |
          scenarios:
            - 'industries/**'
            - 'scenarios/**'
            - 'spec/aes/**'
            - 'tests/functional/test_scenario_compliance.py'

    - name: Test with pytest
      shell: bash
      run: |
        if [ "${{ steps.changes.outputs.scenarios }}" = "true" ] || [ "${{ github.ref }}" = "refs/heads/main" ]; then
          echo "Scenario changes detected or running on main — running full scenario compliance suite."
          pytest tests/ --ignore=tests/security/ --ignore=tests/ui/ --cov=eval_runner --cov-fail-under=90 -n auto --tb=short -p no:plugin_gateway
        else
          echo "No scenario changes detected — skipping scenario compliance suite."
          pytest tests/ --ignore=tests/security/ --ignore=tests/ui/ --ignore=tests/functional/test_scenario_compliance.py --cov=eval_runner --cov-fail-under=90 -n auto --tb=short -p no:plugin_gateway
        fi
      env:
        OTEL_SDK_DISABLED: true

    - name: Security audit tests
      run: pytest tests/security/ -n auto --tb=short
      env:
        OTEL_SDK_DISABLED: true

  mutation-sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        token: ${{ github.token }}
        persist-credentials: false

    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run Mutation Testing Sentinel
      shell: bash
      run: |
        export PYTHONPATH=.
        if [ "${{ github.ref }}" = "refs/heads/main" ]; then
          echo "Running FULL POPULATION mutation sentinel on main branch..."
          python tools/ci/run_mutation_tests.py --full
        else
          echo "Running SAMPLED mutation sentinel on PR / feature branch..."
          python tools/ci/run_mutation_tests.py
        fi

  ui-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Set up Node 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: ui/visual-console/package-lock.json
    # Gate: the Visual Suite MUST build from source. A red job here
    # means the shipped image would silently lack its console UI.
    - name: Build Visual Console production bundle
      run: |
        cd ui/visual-console
        npm ci
        npm run build
    - name: Verify UI production bundle exists
      shell: bash
      run: |
        if [ ! -f ui/visual-console/dist/index.html ]; then
          echo "::error::ui/visual-console/dist/index.html missing — UI build gate failed"
          exit 1
        fi
        echo "UI production bundle present."
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        # Install playwright browsers
        python -m playwright install chromium
    - name: Run Playwright UI tests
      run: pytest tests/ui/ -v -s
      env:
        TRAJECTORY_DIR: tests/data/mock_trajectories
