name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  STRICT_PLUGINS: true

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.12', '3.14']
    
    permissions:
      contents: read

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        token: ${{ github.token }}
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Lint & Format with Ruff
      run: |
        ruff check .
        ruff format --check .

    - name: Verify Documentation Path Validity
      run: python docs/check_doc_paths.py

    - name: Install Playwright Browsers
      run: python -m playwright install --with-deps chromium

    - name: Detect scenario changes
      uses: dorny/paths-filter@v3
      id: changes
      with:
        filters: |
          scenarios:
            - 'industries/**'
            - 'scenarios/**'
            - 'spec/aes/**'
            - 'tests/functional/test_scenario_compliance.py'

    - name: Test with pytest
      shell: bash
      run: |
        if [ "${{ steps.changes.outputs.scenarios }}" = "true" ] || [ "${{ github.ref }}" = "refs/heads/main" ]; then
          echo "Scenario changes detected or running on main — running full scenario compliance suite."
          pytest tests/ --ignore=tests/security/ --ignore=tests/ui/ --cov=eval_runner --cov-fail-under=85 -n auto --tb=short -p no:plugin_gateway
        else
          echo "No scenario changes detected — skipping scenario compliance suite."
          pytest tests/ --ignore=tests/security/ --ignore=tests/ui/ --ignore=tests/functional/test_scenario_compliance.py --cov=eval_runner --cov-fail-under=85 -n auto --tb=short -p no:plugin_gateway
        fi
      env:
        OTEL_SDK_DISABLED: true

    - name: Security audit tests
      run: pytest tests/security/ -n auto --tb=short
      env:
        OTEL_SDK_DISABLED: true

    - name: Mutation testing sentinel
      run: python tools/ci/run_mutation_tests.py

  ui-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        # Install playwright browsers
        python -m playwright install chromium
    - name: Run Playwright UI tests
      run: pytest tests/ui/ -v -s
      env:
        TRAJECTORY_DIR: tests/data/mock_trajectories
