name: CI

on:
  push:
    branches: [ main, dev ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  STRICT_PLUGINS: 'true'

jobs:
  lint:
    if: github.repository == 'najeed/ai-agent-eval-harness'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ github.token }}
        persist-credentials: false

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: |
          pyproject.toml
          requirements*.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff

    - name: Lint & Format with Ruff
      run: |
        ruff check .
        ruff format --check .

    - name: Provider boundary audit
      run: python tools/ci/check_provider_boundaries.py

    - name: Verify Documentation Path Validity
      run: python docs/check_doc_paths.py

  test:
    needs: lint
    if: github.repository == 'najeed/ai-agent-eval-harness'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.12', '3.14']
    
    permissions:
      contents: read

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ github.token }}
        persist-credentials: false
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: |
          pyproject.toml
          requirements*.txt

    - name: Set up Node for independent signature canonicalization tests
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run Deterministic Smoke Test
      run: agentv quickstart

    - name: Detect scenario changes
      uses: dorny/paths-filter@v3
      id: changes
      with:
        base: ${{ github.event_name == 'pull_request' && github.base_ref || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before || 'HEAD~1') }}
        filters: |
          scenarios:
            - 'industries/**'
            - 'scenarios/**'
            - 'spec/aes/**'
            - 'tests/functional/test_scenario_compliance.py'

    - name: Test with pytest
      shell: bash
      run: |
        COV_FLAGS=""
        if [ "${{ matrix.os }}" = "macos-latest" ]; then
          COV_FLAGS="--cov=eval_runner --cov-fail-under=90"
        fi
        if [ "${{ steps.changes.outputs.scenarios }}" = "true" ] || [ "${{ github.ref }}" = "refs/heads/main" ]; then
          echo "Scenario changes detected or running on main — running full scenario compliance suite."
          pytest tests/ --ignore=tests/security/ --ignore=tests/ui/ --ignore=tests/unit/console/test_extension_host_contracts.py $COV_FLAGS -n auto --tb=short -p no:plugin_gateway
        else
          echo "No scenario changes detected — skipping scenario compliance suite."
          pytest tests/ --ignore=tests/security/ --ignore=tests/ui/ --ignore=tests/unit/console/test_extension_host_contracts.py --ignore=tests/functional/test_scenario_compliance.py $COV_FLAGS -n auto --tb=short -p no:plugin_gateway
        fi
      env:
        OTEL_SDK_DISABLED: true

    - name: Measured correlation contract
      run: pytest dataproc_engine/tests/core/test_measured_correlation_contract.py -q

    - name: Security audit tests
      run: pytest tests/security/ -n auto --tb=short
      env:
        OTEL_SDK_DISABLED: true

  mutation-sentinel:
    needs: lint
    if: github.repository == 'najeed/ai-agent-eval-harness'
    runs-on: ubuntu-latest
    # Full-population validation includes hundreds of independently tested mutants.
    timeout-minutes: ${{ github.ref == 'refs/heads/main' && 120 || 45 }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ github.token }}
        persist-credentials: false

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: |
          pyproject.toml
          requirements*.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run Mutation Testing Sentinel
      shell: bash
      run: |
        export PYTHONPATH=.
        if [ "${{ github.ref }}" = "refs/heads/main" ]; then
          echo "Running FULL POPULATION mutation sentinel on main branch..."
          python tools/ci/run_mutation_tests.py --full --workers 3
        else
          echo "Running SAMPLED mutation sentinel on PR / feature branch..."
          python tools/ci/run_mutation_tests.py --workers 3
        fi

    - name: Upload Mutation Assurance Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: mutation-assurance
        path: reports/mutation_scorecard.md
        if-no-files-found: ignore

  ui-test:
    needs: lint
    if: github.repository == 'najeed/ai-agent-eval-harness'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: |
          pyproject.toml
          requirements*.txt
    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: ui/visual-console/package-lock.json
    # Gate: the Visual Suite MUST build from source. A red job here
    # means the shipped image would silently lack its console UI.
    - name: Build Visual Console production bundle
      run: |
        cd ui/visual-console
        npm ci
        npm run build

    - name: Run Document Model and Extension Contract tests
      run: |
        cd ui/visual-console
        npm run test:docmodel

    - name: Verify UI production bundle exists
      shell: bash
      run: |
        if [ ! -f ui/visual-console/dist/index.html ]; then
          echo "::error::ui/visual-console/dist/index.html missing — UI build gate failed"
          exit 1
        fi
        echo "UI production bundle present."
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        # Install playwright browsers
        python -m playwright install --with-deps chromium
    - name: Run Playwright UI tests and Extension Host Contracts
      run: pytest tests/ui/ tests/unit/console/test_extension_host_contracts.py -v -s
      env:
        TRAJECTORY_DIR: tests/data/mock_trajectories
