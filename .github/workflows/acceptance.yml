name: Acceptance Certification

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

jobs:
  acceptance-smoke:
    name: Acceptance Smoke Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Build Visual Console and install Chromium
        run: |
          npm ci --prefix ui/visual-console
          npm run build --prefix ui/visual-console
          python -m playwright install --with-deps chromium
      - name: Run Acceptance Smoke Tests
        run: pytest -m "acceptance and not acceptance_release" --junitxml=reports/acceptance-smoke.xml
        env:
          AGENTV_REQUIRE_BROWSER_ACCEPTANCE: '1'

  acceptance-release:
    name: Acceptance Release Certification Gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Build Visual Console and install Chromium
        run: |
          npm ci --prefix ui/visual-console
          npm run build --prefix ui/visual-console
          python -m playwright install --with-deps chromium
      - name: Run Release Acceptance Suite
        run: pytest -m acceptance_release tests/ui/test_visual_console_ui.py tests/ui/test_verification_workflow_journey.py --junitxml=reports/acceptance-release.xml
        env:
          AGENTV_REQUIRE_BROWSER_ACCEPTANCE: '1'
      - name: Enforce Release Certification Gate
        run: python tools/ci/acceptance_gate.py --report-dir reports/acceptance/latest
      - name: Upload Acceptance Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-artifacts
          path: reports/acceptance/
