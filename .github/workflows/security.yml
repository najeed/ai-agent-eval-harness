name: Security Scan

on:
  push:
    branches: [ "main", "dev" ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  STRICT_PLUGINS: true

jobs:
  python-security:
    if: github.repository == 'najeed/ai-agent-eval-harness'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements.txt
          pip install pip-audit bandit

      - name: Run pip-audit
        # CVE-2026-3219, CVE-2026-6357, PYSEC-2026-196 (pip), PYSEC-2026-139, and CVE-2025-3000 are unpatchable or have no fix versions listed yet.
        # --skip-editable prevents auditing the local 'agentv-runtime' package which is not on PyPI.
        run: pip-audit --desc on --ignore-vuln CVE-2026-3219 --ignore-vuln CVE-2026-6357 --ignore-vuln PYSEC-2026-196 --ignore-vuln PYSEC-2026-139 --ignore-vuln CVE-2025-3000 --skip-editable

      - name: Run Bandit
        run: bandit -r . -ll

  container-security:
    needs: python-security
    if: github.repository == 'najeed/ai-agent-eval-harness' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Build Docker image
        run: docker build -t agentv:latest .

      - name: Scan Docker image with Trivy
        run: trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed agentv:latest
