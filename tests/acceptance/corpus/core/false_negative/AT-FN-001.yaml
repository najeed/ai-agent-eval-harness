acceptance_version: "1.0"

id: AT-FN-001

description: >
  A synthetic tool action exceeding financial limits is blocked by policy and must
  never receive a live certificate, including an authoritative failure certificate.

category: false_negative

scenario:
  path: industries/finance/scenarios/unauthorized_transfer.json
  attempts: 1
  protocol: local
  agent: tests/acceptance/fixtures/agents/violating_transfer_agent.py
  seed: 1004

expect:
  acceptance: PASS

  verification_success: false

  state:
    commit_allowed: false

  policy:
    decision: BLOCK

  evidence:
    required: true
    certificate_forbidden: true
    verification_forbidden: true
    sealed_forbidden: true
