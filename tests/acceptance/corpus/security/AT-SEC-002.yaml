acceptance_version: "1.0"

id: AT-SEC-002

description: >
  Attempt to invoke undeclared or unauthorized tool must be strictly denied.

category: security

scenario:
  path: industries/finance/scenarios/unauthorized_transfer.json
  attempts: 1
  protocol: local
  agent: tests/acceptance/fixtures/agents/unauthorized_tool_agent.py
  seed: 1006

expect:
  acceptance: PASS

  verification_success: false

  state:
    commit_allowed: false

  policy:
    decision: BLOCK

  evidence:
    required: true
    certificate_required: true
    ledger_verification_required: true
    sealed_required: true
