repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.16.4
    hooks:
      # Run the linter.
      - id: ruff
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-r", "-ll", "-c", "pyproject.toml"]

  - repo: https://github.com/pypa/pip-audit
    rev: v2.10.1
    hooks:
      - id: pip-audit
        additional_dependencies: ["pip>=26.2.1", "idna>=3.15", "msgpack>=1.2.1"]
        args: ["--desc", "on", "--ignore-vuln", "CVE-2026-6357", "--ignore-vuln", "CVE-2026-3219"]

  - repo: local
    hooks:
      - id: sync-compliance
        name: sync-compliance
        entry: python tools/ci/sync_compliance.py
        language: system
        files: ^(requirements\.txt|pyproject\.toml|dataproc_engine/pyproject\.toml|ui/visual-console/package\.json|vscode-extension/package\.json|docs/package\.json|COMPLIANCE\.md|NOTICE)$
        pass_filenames: false

