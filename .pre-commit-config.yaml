repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.16.4
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-r", "-ll", "-c", "pyproject.toml"]

  - repo: https://github.com/pypa/pip-audit
    rev: v2.10.1
    hooks:
      - id: pip-audit
        additional_dependencies: ["pip>=26.2.1", "certifi>=2026.10.19", "idna>=3.15", "msgpack>=1.2.1", "urllib3>=2.8.0"]
        args: ["--desc", "on"]

  - repo: local
    hooks:
      - id: sync-compliance
        name: sync-compliance
        entry: python tools/ci/sync_compliance.py
        language: system
        files: ^(requirements\.txt|pyproject\.toml|dataproc_engine/pyproject\.toml|ui/visual-console/package\.json|vscode-extension/package\.json|docs/package\.json|COMPLIANCE\.md|NOTICE)$
        pass_filenames: false

      - id: check-signing-contract-purity
        name: check-signing-contract-purity
        entry: python tools/ci/verify_signing_contract_matrix.py --check-purity
        language: system
        files: ^(tests/unit/core/test_(digest_signature|signing_acceptance|signing_input_policy)_contract\.py|tests/acceptance/test_digest_signature_release_matrix\.py|tests/acceptance/manifests/signing_contract_matrix\.json)$
        pass_filenames: false

      - id: check-mutant-matrix-integrity
        name: check-mutant-matrix-integrity
        entry: python tools/ci/verify_mutant_matrix.py --sync --check-integrity
        language: system
        always_run: true
        pass_filenames: false

      - id: check-provider-boundaries
        name: check-provider-boundaries
        entry: python tools/ci/check_provider_boundaries.py
        language: system
        files: ^(eval_runner/.*\.py|tools/ci/check_provider_boundaries\.py)$
        pass_filenames: false
